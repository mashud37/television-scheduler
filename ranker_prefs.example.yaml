# Show-ranker preferences (hand-editable).
#
# Copy this file to `ranker_prefs.yaml` (gitignored) and edit to taste.
# The ranker loads `ranker_prefs.yaml` if present, otherwise falls back to
# this example so a fresh deploy is functional out of the box.
#
# Override the path at runtime via the RANKER_PREFS_PATH env var. The legacy
# CONFIG_PATH env var (used to point at a JSON file) is still honoured for
# backwards compatibility: the loader picks parser by file extension.

# ── channel_prior ─────────────────────────────────────────────────────────────
# Map channel name -> score. Higher score = stronger preference.
# Negative values penalise; use a large negative (e.g. -100) to effectively
# hide a channel from rankings. Channels not listed get `default_channel_score`.
#
# Names must match the canonical channel names in tvsched/sources/channels.py
# exactly. A name that does not match falls back to default_channel_score and
# silently loses the strongest ranking signal, so the job logs any channel it
# collects that has no weight here.
channel_prior:
  ZDFneo: 3.0
  ARD: 2.0
  ZDF: 2.0
  ARTE: 2.0
  NDR: 2.0
  BR: 2.0
  ONE: 1.0
  SWR/SR: 1.0
  HR: 1.0
  RBB: 1.0
  3sat: 1.0
  MDR: 1.0
  WDR: 1.0
  Radio Bremen: 1.0
  ZDFinfo: 1.0
  # Heavy negatives = effectively hidden from results.
  ARD-alpha: -100.0
  PHOENIX: -100.0
  tagesschau24: -100.0
  KiKA: -100.0

# Score used when a channel isn't in channel_prior.
default_channel_score: 1.0

# ── must_watch_keywords ──────────────────────────────────────────────────────
# Show titles or series names that should always appear at the top of a slot.
# Case-insensitive whole-word match against the show title.
must_watch_keywords:
  - München Mord
  - Hubert und Staller
  - Hubert ohne Staller
  - Eberhoferkrimi

# ── component_weights ────────────────────────────────────────────────────────
# Relative weights of the ranking signals. App-level tuning; usually leave as-is.
component_weights:
  channel: 1.5
  title: 1.3
  Description: 0.7
  Cast: 0.25
  Crew: 0.15

# ── time slots (minutes since midnight) ──────────────────────────────────────
# Three boundaries define two "viewing slots": early (early_start..late_start)
# and late (late_start..late_end). Anything outside both is bucketed as "night".
# Defaults in the example: 20:15 / 21:35 / 23:15 (German prime-time pattern).
early_start_min: 1215   # 20:15
late_start_min:  1295   # 21:35
late_end_min:    1395   # 23:15
