# Standardized deployment manifest, see ../GCLOUD_POLICY.md
# Single source of truth for `python ../manage.py`.
app: tv-scheduler
prefix: tvsched
region: europe-west1
type: service

artifact_registry:
  repo: tvsched
  image: tvsched/app:latest

service_account:
  name: tvsched-sa
  display: "TV Scheduler, Cloud Scheduler invoker"
  roles: [roles/run.invoker]

buckets:
  - role: data
    suffix: tvsched-data
    volume_mount: /mnt/data

# Files uploaded to the data bucket on install if present locally.
# manage.py's do_uploads() skips entries whose local file is missing.
uploads:
  - local: assets/models/tv_component_models.joblib
    bucket_role: data
    dest: models/tv_component_models.joblib
  # User-specific ranker preferences (gitignored). Mounts at
  # /mnt/data/ranker_prefs.yaml inside the container, the default
  # RANKER_PREFS_PATH in tvsched/ranker.py.
  - local: ranker_prefs.yaml
    bucket_role: data
    dest: ranker_prefs.yaml

env_file: env.yaml
base_url_var: BASE_URL

# Filled from ../user_config.yaml at install (only when missing/placeholder).
env_from_shared:
  SMTP_HOST: smtp_host
  SMTP_PORT: smtp_port
  SMTP_USER: smtp_user
  SMTP_PASS: smtp_pass
  EMAIL_TO: email_to
# Auto-generated with secrets.token_hex(32) if missing/placeholder.
env_generated:
  - SECRET_KEY
  - ACCESS_TOKEN
  - JOB_TOKEN

service:
  name: tvsched
  allow_unauthenticated: true
  memory: 2Gi
  cpu: 2
  max_instances: 1
  timeout: 1800

# Fires twice a day; the job exits in a few seconds unless CYCLE_DAYS have passed
# since the last run that produced scores. A failed cycle therefore costs half a
# day rather than a whole cycle, with no extra infrastructure. The 12-hour cadence
# also gives the dead-man's-switch alert (23h absence window, the Cloud Monitoring
# maximum) two missed wake-ups of margin before it fires.
schedulers:
  - name: tvsched-weekly-sched
    schedule: "0 7,19 * * *"
    time_zone: Europe/Berlin
    http_method: GET
    path: /internal/run-job
    auth: token
    token_env: JOB_TOKEN
    attempt_deadline: 1800s
    max_retry_attempts: 3
    min_backoff: 300s
    max_backoff: 3600s
